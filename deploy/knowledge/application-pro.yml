# 模板：复制为 APP_HOME/application-pro.yml（勿提交 Git）

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moli}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      min-idle: ${DRUID_MIN_IDLE:5}
      max-active: ${DRUID_MAX_ACTIVE:30}
      initial-size: ${DRUID_INITIAL_SIZE:5}
      max-wait: 10000
      validation-query: SELECT 1
      test-while-idle: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  output:
    ansi:
      enabled: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 3000
    database: ${SPRING_REDIS_DATABASE:1}
    jedis:
      pool:
        max-active: 200
        max-wait: 3000
        max-idle: 20
        min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs
    name: knowledge-server.log

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:moli-knowledge}

swagger:
  show: false

moli:
  user-center:
    shiro:
      enabled: true
      session-expire-seconds: 86400
      anon-paths:
        - /actuator/**

kb:
  llm:
    nacos:
      enabled: false
    enabled: ${KB_LLM_ENABLED:true}
    provider: ${KB_LLM_PROVIDER:glm}
    base-url: ${KB_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${KB_LLM_API_KEY:}
    model: ${KB_LLM_MODEL:glm-4-flash}
    temperature: 0.3
    timeout-seconds: 90
    config-secret: ${KB_LLM_CONFIG_SECRET:}
  search:
    mode: fulltext
    ask-candidate-limit: 100
  sync:
    enabled: true
    python: ${KB_SYNC_PYTHON:python3}
    script-path: ${KB_SYNC_SCRIPT_PATH:/opt/moli-project-distribute/moli-knowledge/kb/tools/sync_to_db.py}
    space-code: enterprise-kb
    timeout-seconds: 300
    schedule-enabled: false
  wiki:
    enabled: true
    root: ${KB_WIKI_ROOT:/opt/moli-project-distribute/moli-knowledge/kb}
    space-dirs:
      enterprise-kb: wiki
      moli-ops-manual: wiki-moli
      jp-fe-ap-exam: wiki-jp-exam
    max-bytes: 2097152
    lint-script-path: ${KB_LINT_SCRIPT_PATH:/opt/moli-project-distribute/moli-knowledge/kb/tools/lint.py}
    lint-timeout-seconds: 120
    govern:
      models: []
  ingest:
    enabled: ${KB_INGEST_ENABLED:true}
    raw-root: ${KB_RAW_ROOT:/opt/moli-project-distribute/moli-knowledge/kb/raw}
    max-pages-per-batch: 15
    max-tree-nodes: 5000
    raw-snippet-chars: 4000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
