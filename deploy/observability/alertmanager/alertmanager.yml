# 本地 PoC。生产必须换 secret、改内网 URL、加钉钉/企微 receiver。
global:
  resolve_timeout: 5m

route:
  receiver: moli-aiops
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: moli-aiops
      group_wait: 5s

receivers:
  - name: moli-aiops
    webhook_configs:
      - url: http://host.docker.internal:28105/hooks/alertmanager
        send_resolved: false
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials: moli-local-alert-webhook

inhibit_rules:
  - source_matchers:
      - alertname="MoliServiceDown"
    target_matchers:
      - alertname=~"MoliHttp5xx|MoliHeapHigh"
    equal: [service]
