groups:
  - name: moli-core
    rules:
      - alert: MoliServiceDown
        expr: up{service=~"moli-gateway|user-center-server|order-server|ai-server|knowledge-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} Prometheus 抓取失败"
          description: "{{ $labels.service }}（{{ $labels.instance }}）已连续 2 分钟 up=0。未启动的本地服务也会触发，属预期。"

      - alert: MoliHttp5xx
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum by (service) (rate(http_server_requests_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} HTTP 5xx 占比过高"
          description: "近 5 分钟 5xx 占总请求超过 5%。"

      - alert: MoliHeapHigh
        expr: |
          (
            sum by (service) (jvm_memory_used_bytes{area="heap"})
            /
            clamp_min(sum by (service) (jvm_memory_max_bytes{area="heap"}), 1)
          ) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 堆内存偏高"
          description: "JVM heap used/max > 90% 已持续 5 分钟。"
