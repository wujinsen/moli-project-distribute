name: moli-observability

# 单机开发/预发验证栈。生产环境需改为独立主机、持久化外部存储和正式认证。
services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: moli-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: moli-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "29093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    container_name: moli-loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "28110:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: moli-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "28111:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../..:/workspace:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: moli-grafana
    ports:
      - "28300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  skywalking-banyandb:
    image: apache/skywalking-banyandb:0.10.3
    container_name: moli-skywalking-banyandb
    command:
      - standalone
      - --stream-root-path=/tmp/stream-data
      - --measure-root-path=/tmp/measure-data
    ports:
      - "28123:17913"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 5s
      timeout: 60s
      retries: 120
    restart: unless-stopped

  skywalking-oap:
    image: apache/skywalking-oap-server:10.4.0
    container_name: moli-skywalking-oap
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: skywalking-banyandb:17912
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: prometheus
      JAVA_OPTS: "-Xms512m -Xmx512m -Duser.timezone=Asia/Shanghai"
    ports:
      - "28121:11800"
      - "28122:12800"
    depends_on:
      skywalking-banyandb:
        condition: service_healthy
    restart: unless-stopped

  # UI 10.4 Trace 列表默认走 queryBasicTraces（V2 探测不会在列表页触发）；
  # BanyanDB 已禁用该 API。Python 把 v1 改写成 queryTraces。
  # UI 的 Armeria 客户端用 HTTP/2 明文（h2c），所以前面再加一层 Caddy。
  skywalking-graphql-rewrite:
    image: python:3.12-alpine
    container_name: moli-skywalking-graphql-rewrite
    command: ["python", "/app/graphql_banyandb_compat.py"]
    environment:
      OAP_URL: http://skywalking-oap:12800
      LISTEN_PORT: "12800"
    volumes:
      - ./skywalking-ui/graphql_banyandb_compat.py:/app/graphql_banyandb_compat.py:ro
    depends_on:
      - skywalking-oap
    restart: unless-stopped

  skywalking-graphql-compat:
    image: caddy:2-alpine
    container_name: moli-skywalking-graphql-compat
    volumes:
      - ./skywalking-ui/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - skywalking-graphql-rewrite
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:10.4.0
    container_name: moli-skywalking-ui
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-graphql-compat:12800
    ports:
      - "28120:8080"
    depends_on:
      - skywalking-graphql-compat
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
