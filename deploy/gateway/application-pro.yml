# 模板：复制为 APP_HOME/application-pro.yml（勿提交 Git）

server:
  port: ${SERVER_PORT:21000}
  shutdown: graceful
  netty:
    connection-timeout: 5s

spring:
  cloud:
    gateway:
      enabled: true
      discovery:
        locator:
          lower-case-service-id: true
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
        pool:
          type: elastic
          max-connections: 500
          max-idle-time: 60s
      routes:
        - id: user-center-route
          uri: lb://user-center-server
          predicates:
            - Path=/UserCenter/**
          filters:
            - StripPrefix=1
        - id: order-route
          uri: lb://order-server
          predicates:
            - Path=/OrderServer/**
          filters:
            - StripPrefix=1
        - id: ai-route
          uri: lb://ai-server
          predicates:
            - Path=/AiServer/**
          filters:
            - StripPrefix=1
        - id: knowledge-route
          uri: lb://knowledge-server
          predicates:
            - Path=/KnowledgeServer/**
          filters:
            - StripPrefix=1

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs
    name: moli-gateway.log
  level:
    root: INFO
    com.moli.gateway: INFO
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      env: pro
