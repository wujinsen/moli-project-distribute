# 已合并至 docker-compose.nacos.yml（统一 28548/29548，兼容 Windows Hyper-V 保留端口段）
# 保留本文件仅为兼容旧命令；内容与 nacos.yml 相同。

services:
  nacos:
    image: nacos/nacos-server:v2.5.2
    container_name: nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: ip
      NACOS_SERVER_IP: 127.0.0.1
    ports:
      - "28548:8848"
      - "29548:9848"
      - "29549:9849"
    restart: unless-stopped
