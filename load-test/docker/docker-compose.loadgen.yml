# Distributed k6 load generators + optional InfluxDB/Grafana for metrics
# Usage:
#   docker compose -f load-test/docker/docker-compose.loadgen.yml up --scale k6-worker=20
#
# Note: million QPS requires 50-200+ worker containers on a dedicated cluster.
# This compose file is a template; tune WORKERS and host networking per environment.

services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influx-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - influxdb

  k6-coordinator:
    image: grafana/k6:0.51.0
    working_dir: /scripts
    volumes:
      - ../k6:/scripts/k6:ro
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:21000}
      TARGET_RPS: ${TARGET_RPS:-10000}
      DURATION: ${DURATION:-5m}
      K6_OUT: influxdb=http://influxdb:8086/k6
    command: run /scripts/k6/seckill-smoke.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb

  k6-worker:
    image: grafana/k6:0.51.0
    working_dir: /scripts
    volumes:
      - ../k6:/scripts/k6:ro
      - ../scripts/run-distributed-k6.sh:/scripts/run-distributed-k6.sh:ro
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:21000}
      TARGET_RPS: ${TARGET_RPS:-10000}
      DURATION: ${DURATION:-5m}
      WORKERS: ${WORKERS:-10}
      K6_OUT: influxdb=http://influxdb:8086/k6
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        idx=$${HOSTNAME##*-}
        total=$${WORKERS:-10}
        start=$$(awk "BEGIN {print $$idx/$$total}")
        end=$$(awk "BEGIN {print ($$idx+1)/$$total}")
        per=$$(awk "BEGIN {print int($${TARGET_RPS:-10000}/$$total)}")
        k6 run --execution-segment "$${start}:$${end}:0" --execution-segment-sequence "$$idx" \
          -e BASE_URL=$${BASE_URL} -e TARGET_RPS=$$per -e DURATION=$${DURATION} \
          -o "$${K6_OUT}" /scripts/k6/seckill-million.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 10
    depends_on:
      - influxdb

volumes:
  influx-data:
