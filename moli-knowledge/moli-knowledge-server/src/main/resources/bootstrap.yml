spring:
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:http://127.0.0.1:28548}
        namespace: dev

dubbo:
  registry:
    address: spring-cloud://127.0.0.1
  cloud:
    subscribed-services: user-center-server
  protocols:
    dubbo:
      port: 28884
  consumer:
    check: false

