server:
  port: 28104
  shutdown: graceful

spring:
  profiles:
    active: dev
  application:
    name: knowledge-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    # Shiro securityManager 与 Filter 链在部分 Boot 版本下存在循环依赖，允许 Spring 延迟注入
    allow-circular-references: true

id:
  snowflake:
    worker_id: 4
    data_center_id: 1

moli:
  user-center:
    shiro:
      anon-paths:
        - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active:default}
