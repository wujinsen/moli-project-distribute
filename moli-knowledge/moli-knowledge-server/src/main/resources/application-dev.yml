spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: root
    password: 12345678
    druid:
      min-idle: 5
      max-active: 30
      initial-size: 5
      max-wait: 10000
      validation-query: SELECT 1
      test-while-idle: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  output:
    ansi:
      enabled: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 86400000
    database: 1
    jedis:
      pool:
        max-active: 200
        max-wait: -1
        max-idle: 10
        min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  config: classpath:logback-spring.xml

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: moli-knowledge

swagger:
  show: true

moli:
  user-center:
    shiro:
      # 必须为 true，否则无法从 Redis 读取登录 Session，空间 ACL / superadmin 均失效（/kb/space/mine 只剩公开空间）
      enabled: true
      session-expire-seconds: 86400

# 知识库 Query(/kb/ask) LLM：后端 kb.llm.* 配 provider/key；是否调用由前端请求 useLlm 控制（默认 false）
# Nacos 托管见 docs/nacos/knowledge-server-kb-llm-dev.yaml（暂未启用 kb.llm.nacos.enabled）
kb:
  llm:
    nacos:
      enabled: false
      data-id: knowledge-server-kb-llm-dev.yaml
      group: DEFAULT_GROUP
    enabled: true
    provider: glm
    base-url: https://open.bigmodel.cn/api/paas/v4
    api-key: ${ZHIPU_API_KEY:e3cce3056c10404cb27bd7bc9bfe6cfa.h8eD7w474NtdLzM0}
    model: glm-4-flash
    temperature: 0.3
    timeout-seconds: 90
  search:
    # fulltext：用 kb_document 上 ngram 全文索引 ftx_kb_document（MATCH AGAINST）；like：旧三字段 LIKE
    mode: fulltext
    # Query(/kb/ask) 候选召回上限：先用全文索引按相关度取至多 N 页，再做内存 bigram 精排，避免全量扫描
    ask-candidate-limit: 100
  sync:
    enabled: true
    python: python
    script-path: moli-knowledge/kb/tools/sync_to_db.py
    space-code: enterprise-kb
    timeout-seconds: 300
    schedule-enabled: false
    schedule-cron: "0 0 2 * * ?"
