spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: root
    password: 12345678
    druid:
      min-idle: 5
      max-active: 30
      initial-size: 5
      max-wait: 10000
      validation-query: SELECT 1
      test-while-idle: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  output:
    ansi:
      enabled: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 86400000
    database: 2
    jedis:
      pool:
        max-active: 200
        max-wait: -1
        max-idle: 10
        min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  config: classpath:logback-spring.xml

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: moli-knowledge

swagger:
  show: true

moli:
  user-center:
    shiro:
      enabled: true
      session-expire-seconds: 86400

# 知识库 Query(/kb/ask) 的 LLM 配置（OpenAI 兼容；DeepSeek/Qwen/GLM）
# enabled=false 或 api-key 为空时，/kb/ask 自动降级为「检索式」答案
kb:
  llm:
    enabled: false
    provider: deepseek
    base-url: https://api.deepseek.com/v1
    api-key: ""
    model: deepseek-chat
    temperature: 0.3
    timeout-seconds: 90
