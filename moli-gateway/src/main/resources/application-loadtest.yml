# Gateway 百万 QPS 压测专用配置
# 启动: mvn spring-boot:run -Dspring-boot.run.profiles=loadtest

server:
  port: 28100
  shutdown: graceful
  netty:
    connection-timeout: 3s

spring:
  application:
    name: moli-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  codec:
    max-in-memory-size: 256KB
  cloud:
    gateway:
      enabled: true
      discovery:
        locator:
          lower-case-service-id: true
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
        pool:
          type: elastic
          max-connections: 10000
          max-idle-time: 30s
          eviction-interval: 10s
      routes:
        - id: user-center-route
          uri: lb://user-center-server
          predicates:
            - Path=/UserCenter/**
          filters:
            - StripPrefix=1
        - id: order-route
          uri: lb://order-server
          predicates:
            - Path=/OrderServer/**
          filters:
            - StripPrefix=1
        - id: ai-route
          uri: lb://ai-server
          predicates:
            - Path=/AiServer/**
          filters:
            - StripPrefix=1

logging:
  level:
    root: WARN
    com.moli.gateway: INFO
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN

management:
  server:
    port: 28100
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      profile: loadtest
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
