
spring:
  cloud:
    gateway:
      enabled:  true
      discovery:
        locator:
          lower-case-service-id: true
      # spring cloud route config -- UserCenter Server
      routes:
      - id: user-center-route
        uri: lb://user-center-server
        predicates:
        - Path=/UserCenter/**
        filters:
        - StripPrefix=1
      # spring cloud route config -- Order Server
      - id: order-route
        uri: lb://order-server
        predicates:
        - Path=/OrderServer/**
        filters:
        - StripPrefix=1
      # spring cloud route config -- AI Server
      - id: ai-route
        uri: lb://ai-server
        predicates:
        - Path=/AiServer/**
        filters:
        - StripPrefix=1
      # spring cloud route config -- Knowledge Server
      - id: knowledge-route
        uri: lb://knowledge-server
        predicates:
        - Path=/KnowledgeServer/**
        filters:
        - StripPrefix=1
      # spring cloud route config -- AIOps (FastAPI, 演示期可改为固定 URI)
      - id: aiops-route
        uri: http://127.0.0.1:28105
        predicates:
        - Path=/AiOpsServer/**
        filters:
        - StripPrefix=1


