# mysql数据库的配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 12345678
  # druid 配置信息
  druid:
    min-idle: 3
    max-active: 15
    initial-size: 5
    min-evictable-idle-time-millis: 30000
    max-evictable-idle-time-millis: 60000
    validation-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 彩色控制台日志级别
  output:
    ansi:
      enabled: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
   #Redis数据源
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 86400000
    database: 1
    jedis:
      pool:
        max-active: 1000  # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1      # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10      # 连接池中的最大空闲连接
        min-idle: 5       # 连接池中的最小空闲连接

# AI-4 ChatBI · W5 安全底座（契约 §3.3）
bi:
  chat:
    allow-tables:
      - seckill_order
      - seckill_activity
    deny-columns:
      - password
      - salt
      - token
      - secret
    default-rows: 100
    max-rows: 1000
    max-scan-rows: 10000
    query-timeout-ms: 30000
    max-retry: 2
    readonly-datasource:
      # dev 冒烟可与主库同账号；生产须独立 moli_bi_ro（见 docs/sql/32_ai_chat_trace.sql）
      url: jdbc:mysql://localhost:3306/moli?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 12345678
      driver-class-name: com.mysql.cj.jdbc.Driver
  agent:
    base-url: http://127.0.0.1:1130
    timeout-ms: 60000

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml

moli:
  user-center:
    shiro:
      # W7：默认开启鉴权（ai:chat:* · 见 docs/sql/33_ai_chat_permissions.sql）
      enabled: true
      session-expire-seconds: 86400
      # 仅本地 Gradio 无 token 冒烟时临时改为 true（勿用于网关联调）
      # anon-paths:
      #   - /bi/chat/**

