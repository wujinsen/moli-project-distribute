# kb/wiki markdown → MySQL 同步 CI
#
# - PR：dry-run-all（三空间解析）+ lint-all（仅报告，不拦截）
# - push main/master / workflow_dispatch ci：dry-run 同上 → sync-all + verify-all
#
# 三个 wiki 空间（唯一清单在 run_sync.sh 的 KB_SPACES）：
#   wiki -> enterprise-kb / wiki-ops -> moli-ops-manual / wiki-jp-exam -> jp-fe-ap-exam
#
# 远程库 Secrets（手动 sync 时用）：
#   必填：KB_SYNC_DB_HOST / KB_SYNC_DB_USER / KB_SYNC_DB_PASSWORD
#   可选：KB_SYNC_DB_PORT / KB_SYNC_DB_NAME
#   注：remote 现按 KB_SPACES 全空间同步，不再用 KB_SYNC_SPACE 单空间

name: KB Wiki Sync

on:
  push:
    branches: [main, master]
    paths: &kb_paths
      - 'moli-knowledge/kb/wiki/**'
      - 'moli-knowledge/kb/wiki-ops/**'
      - 'moli-knowledge/kb/wiki-jp-exam/**'
      - 'moli-knowledge/kb/tools/**'
      - 'docs/sql/03_knowledge_schema.sql'
      - '.github/workflows/kb-sync.yml'
  pull_request:
    paths: *kb_paths
  workflow_dispatch:
    inputs:
      target:
        description: 'Sync target'
        required: true
        default: ci
        type: choice
        options:
          - ci
          - remote

concurrency:
  group: kb-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry-run (parse all wiki spaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: moli-knowledge/kb/tools/requirements-sync.txt

      - name: Install pymysql
        run: pip install -r moli-knowledge/kb/tools/requirements-sync.txt

      - name: sync_to_db.py --dry-run (all spaces)
        run: bash moli-knowledge/kb/tools/ci/run_sync.sh dry-run-all

      - name: Lint report (all spaces, non-blocking)
        run: bash moli-knowledge/kb/tools/ci/run_sync.sh lint-all

  sync-mysql:
    name: Sync to MySQL (CI)
    needs: dry-run
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'ci')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_kb_sync
          MYSQL_DATABASE: moli
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_kb_sync"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      KB_SYNC_HOST: 127.0.0.1
      KB_SYNC_PORT: 3306
      KB_SYNC_USER: root
      KB_SYNC_PASSWORD: ci_kb_sync
      KB_SYNC_DB: moli
      KB_SYNC_SPACE: enterprise-kb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: moli-knowledge/kb/tools/requirements-sync.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          pip install -r moli-knowledge/kb/tools/requirements-sync.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -pci_kb_sync --silent; then
              echo "MySQL is up"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL not ready" >&2
          exit 1

      - name: Init kb schema
        run: bash moli-knowledge/kb/tools/ci/run_sync.sh init-schema

      - name: Run sync_to_db.py (all spaces)
        run: bash moli-knowledge/kb/tools/ci/run_sync.sh sync-all

      - name: Verify synced documents (per space)
        run: bash moli-knowledge/kb/tools/ci/run_sync.sh verify-all

  sync-remote:
    name: Sync to remote MySQL
    needs: dry-run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'remote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: moli-knowledge/kb/tools/requirements-sync.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          pip install -r moli-knowledge/kb/tools/requirements-sync.txt

      - name: sync_to_db.py (remote, all spaces)
        env:
          KB_SYNC_HOST: ${{ secrets.KB_SYNC_DB_HOST }}
          KB_SYNC_PORT: ${{ secrets.KB_SYNC_DB_PORT }}
          KB_SYNC_USER: ${{ secrets.KB_SYNC_DB_USER }}
          KB_SYNC_PASSWORD: ${{ secrets.KB_SYNC_DB_PASSWORD }}
          KB_SYNC_DB: ${{ secrets.KB_SYNC_DB_NAME }}
        run: |
          if [[ -z "${KB_SYNC_HOST}" || -z "${KB_SYNC_USER}" || -z "${KB_SYNC_PASSWORD}" ]]; then
            echo "Missing secrets: KB_SYNC_DB_HOST, KB_SYNC_DB_USER, KB_SYNC_DB_PASSWORD" >&2
            exit 1
          fi
          bash moli-knowledge/kb/tools/ci/run_sync.sh sync-all

      - name: Verify synced documents (per space)
        env:
          KB_SYNC_HOST: ${{ secrets.KB_SYNC_DB_HOST }}
          KB_SYNC_PORT: ${{ secrets.KB_SYNC_DB_PORT }}
          KB_SYNC_USER: ${{ secrets.KB_SYNC_DB_USER }}
          KB_SYNC_PASSWORD: ${{ secrets.KB_SYNC_DB_PASSWORD }}
          KB_SYNC_DB: ${{ secrets.KB_SYNC_DB_NAME }}
        run: bash moli-knowledge/kb/tools/ci/run_sync.sh verify-all
