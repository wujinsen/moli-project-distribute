### 配置端口号
server:
  port: 8888
  shutdown: graceful #优雅停机配置, springboot 2.3.0开始提供

### 选择环境
spring:
  application:
    name: user-center-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: dev

captcha:
  enabled: false

shiro:
  single-session: false

sso:
  enabled: true
  ticket-ttl-seconds: 60
  entry-path: /sso/login
  shared-secret: ${SSO_SHARED_SECRET:}

ops:
  secret:
    key: ${OPS_SECRET_KEY:}
  health:
    probe-enabled: ${OPS_HEALTH_PROBE_ENABLED:true}
    probe-cron: ${OPS_HEALTH_PROBE_CRON:0 0/15 * * * ?}
  deploy:
    enabled: ${OPS_DEPLOY_ENABLED:false}
    deploy-root: ${OPS_DEPLOY_ROOT:/opt/moli-project-distribute}
    script-path: ${OPS_DEPLOY_SCRIPT:}
    timeout-seconds: 15
