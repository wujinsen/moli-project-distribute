
spring:
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:http://127.0.0.1:28548}
        namespace: dev
        extension-configs:
          - data-id: aaa-dev.yaml
            refresh: true
          - data-id: bbb-dev.yaml
            refresh: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:http://127.0.0.1:28548}
        namespace: dev

dubbo:
  registry:
    # 挂载到 Spring Cloud 注册中心
    address: spring-cloud://127.0.0.1
  cloud:
    # The subscribed services in consumer side
    subscribed-services:
  scan:
    # dubbo 服务扫描基准包
    base-packages: com.moli.user.center.server.provider
  protocols:
    dubbo:
      port: 28881
  consumer:
    check: false

