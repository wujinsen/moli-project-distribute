
spring:
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos
      config:
        server-addr: http://127.0.0.1:8848
        namespace: 4fa85588-6ab5-479b-aea2-2b1d2e52db7a
        extension-configs:
          - data-id: aaa-dev.yaml
            refresh: true
          - data-id: bbb-dev.yaml
            refresh: true
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: 4fa85588-6ab5-479b-aea2-2b1d2e52db7a

dubbo:
  registry:
    # 挂载到 Spring Cloud 注册中心
    address: spring-cloud://127.0.0.1
  cloud:
    # The subscribed services in consumer side
    subscribed-services:
  scan:
    # dubbo 服务扫描基准包
    base-packages: com.moli.user.center.server.provider
  protocols:
    dubbo:
      port: 20881
  consumer:
    check: false

