# mysql数据库的配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: root
    password: 12345678
    druid:
      min-idle: 10
      max-active: 100
      initial-size: 10
      max-wait: 10000
      min-evictable-idle-time-millis: 600000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      remove-abandoned: true
      remove-abandoned-timeout: 120
      log-abandoned: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  output:
    ansi:
      enabled: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 86400000
    database: 1
    jedis:
      pool:
        max-active: 1000
        max-wait: -1
        max-idle: 10
        min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  config: classpath:logback-spring.xml

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin

swagger:
  show: true

ops:
  secret:
    key: your-local-dev-secret
  command:
    enabled: true
  deploy:
    enabled: true                # 若要用 restartService 后置
  upload:
    enabled: true