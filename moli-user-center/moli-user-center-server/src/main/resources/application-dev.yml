# mysql数据库的配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli-user-center?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.jdbc.Driver
    username: root
    password: 12345678
  # druid 配置信息
  druid:
    min-idle: 3
    max-active: 15
    initial-size: 5
    min-evictable-idle-time-millis: 30000
    max-evictable-idle-time-millis: 60000
    validation-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 彩色控制台日志级别
  output:
    ansi:
      enabled: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8081
      eager: true
      web-context-unify: true

