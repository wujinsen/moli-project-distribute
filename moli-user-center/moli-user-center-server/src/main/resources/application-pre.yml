# 预发布环境（容量略低于生产，结构同 pro）

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: root
    password: 12345678
    druid:
      initial-size: ${DRUID_INITIAL_SIZE:15}
      min-idle: ${DRUID_MIN_IDLE:15}
      max-active: ${DRUID_MAX_ACTIVE:50}
      max-wait: ${DRUID_MAX_WAIT:10000}
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      remove-abandoned: true
      remove-abandoned-timeout: 120
      log-abandoned: true
      filters: stat,wall
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true
      stat-view-servlet:
        enabled: false

  servlet:
    multipart:
      max-file-size: ${OPS_UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${OPS_UPLOAD_MAX_REQUEST_SIZE:210MB}

  output:
    ansi:
      enabled: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 3000
    database: 1
    jedis:
      pool:
        max-active: 100
        max-wait: 3000
        max-idle: 30
        min-idle: 10

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  config: classpath:logback-spring.xml

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

minio:
  url: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin

swagger:
  show: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      env: pre
    distribution:
      percentiles-histogram:
        http.server.requests: true
