
spring:
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: nacos
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:28548}
        namespace: dev
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:28548}
        namespace: dev

dubbo:
  registry:
    # 挂载到 Spring Cloud 注册中心
    address: spring-cloud://127.0.0.1
  cloud:
    # The subscribed services in consumer side
    subscribed-services: user-center-server
  protocols:
    dubbo:
      port: 28882
  consumer:
    check: false

