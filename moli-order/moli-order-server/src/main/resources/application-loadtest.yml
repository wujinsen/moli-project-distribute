# 百万 QPS 秒杀压测专用配置
# 启动: java -jar order-server.jar --spring.profiles.active=loadtest
# 或 IDE 中 active profile = loadtest

server:
  port: 8087
  tomcat:
    threads:
      max: 800
      min-spare: 200
    accept-count: 10000
    max-connections: 20000
  shutdown: graceful

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moli?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 12345678
  druid:
    min-idle: 50
    max-active: 200
    initial-size: 50
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 3000
    database: 1
    lettuce:
      pool:
        max-active: 500
        max-idle: 100
        min-idle: 50
        max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.moli.order: INFO

moli:
  user-center:
    shiro:
      anon-paths:
        - /seckill/**
        - /actuator/**
  seckill:
    load-test-mode: true
    async-db: true
    default-stock: 1000000
    db-batch-size: 1000
    consumer-poll-ms: 20

id:
  snowflake:
    worker_id: 1
    data_center_id: 1

swagger:
  show: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      profile: loadtest
    distribution:
      percentiles-histogram:
        http.server.requests: true
